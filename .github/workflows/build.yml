name: Build distributables

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux portable tar.gz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libgl1-mesa-dev libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: gcc_64
          archives: qtbase qtsvg
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          -DLULU_WITH_LLAMA=ON -DLULU_FETCH_LLAMA=ON
          -DLULU_LLAMA_TAG=b10333 -DLULU_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build-linux --parallel "$(nproc)"

      - name: Bundle Qt and create tar.gz
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps dist
          cp build-linux/lulu_code AppDir/usr/bin/lulu_code
          cp resources/icons/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/lulu-code.png
          cat > AppDir/usr/share/applications/lulu-code.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lulu Code
          Exec=lulu_code
          Icon=lulu-code
          Categories=Development;IDE;
          Terminal=false
          EOF
          curl -L --fail --retry 3 -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          
          export PATH="$PWD:$PATH"
          export EXTRA_QT_MODULES=svg
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt
          tar -czf dist/lulu-code-linux-x86_64.tar.gz -C AppDir .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: lulu-code-linux-x86_64
          path: dist/lulu-code-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build-win -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DLULU_WITH_LLAMA=ON -DLULU_FETCH_LLAMA=ON
          -DLULU_LLAMA_TAG=b10333 -DLULU_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-win --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item build-win/Release/lulu_code.exe dist/windows/lulu_code.exe
          windeployqt --release --compiler-runtime dist/windows/lulu_code.exe

      - name: Build self-contained installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc installer/LuluCode.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lulu-code-windows-x64
          path: dist/lulu-code-setup.exe
          if-no-files-found: error
          retention-days: 30